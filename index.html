<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .header { color: #0088cc; margin: 15px 0; font-size: 20px; font-weight: bold; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 500px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); 
                cursor: pointer; text-align: center; border: 1px solid #eee; font-weight: 500; font-size: 14px; transition: 0.2s; 
                display: flex; align-items: center; justify-content: center; min-height: 50px; }
        .card:active { background: #eef7ff; transform: scale(0.96); }
        .brand-card { font-size: 12px; text-transform: uppercase; padding: 10px 5px; }
        .tt-special { background: #fff4e5; border: 1px solid #ffcc80; color: #e67e22; font-weight: bold; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 20px; }
        .link-btn { background: #34a853; color: white; padding: 15px; border-radius: 10px; text-decoration: none; 
                    font-weight: bold; text-align: center; box-shadow: 0 4px 12px rgba(52,168,83,0.3); }
        .pres-btn { background: #ea4335; box-shadow: 0 4px 12px rgba(234,67,53,0.3); cursor: pointer; }
        .back-btn { margin-top: 25px; background: #6c757d; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div id="step1" style="width: 100%;">
    <div class="header">🏢 აირჩიე ქსელი</div>
    <div class="grid">
        <div class="card" onclick="nextStep('კარფური')">კარფური</div>
        <div class="card" onclick="nextStep('სუფთა სახლი')">სუფთა სახლი</div>
        <div class="card" onclick="nextStep('გუდვილი')">გუდვილი</div>
        <div class="card" onclick="nextStep('ფრესკო')">ფრესკო</div>
        <div class="card" onclick="nextStep('ნიკორა-ლიბრე')">ნიკორა-ლიბრე</div>
        <div class="card" onclick="nextStep('მაგნიტი')">მაგნიტი</div>
        <div class="card" onclick="nextStep('მემო')">მემო</div>
        <div class="card" style="background: #e3f2fd; border-color: #2196f3;" onclick="nextStep('TT')">💼 TT (Traditional)</div>
    </div>
</div>

<div id="step2" style="display:none; width: 100%;">
    <div class="header" id="selectedNetwork"></div>
    <div class="grid" id="brandGrid"></div>
    <button class="back-btn" onclick="goBack()">🔙 უკან დაბრუნება</button>
</div>

<div id="step3" style="display:none; width: 100%;">
    <div class="header" id="selectedBrand"></div>
    <div class="btn-container">
        <a href="#" id="shelfLink" class="link-btn" target="_blank">📊 დალაგების წილი</a>
        <a href="#" id="presLink" class="link-btn pres-btn" target="_blank">🖼️ პრეზენტაცია</a>
    </div>
    <button class="back-btn" onclick="goBackToBrands()">🔙 ბრენდებზე დაბრუნება</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    // ზოგადი ბრენდების სია სხვა ქსელებისთვის
    const baseBrands = [
        "NEFIS COSMETICS", "SODAL", "NIVEA", "IPEK", "EUREKA", "ARIX", "PACLAN", 
        "DEEP FRESH", "PEROS", "MC BRIDE", "WHITE DAY", "NEON", "SOFFIONE", 
        "HAYAT - BINGO", "HAYAT-MOLPED", "HAYAT-MOLFIX"
    ];

    // კარფურის სპეციალური ბრენდების სია
    const carrefourBrands = [
        "ARIX", "DEEP FRESH", "YPEK", "NIVEA", "PEROS", "SODAL", "HAYAT", "NEFIS COSMETICS", "EUREKA"
    ];

    // პრეზენტაციების ლინკების მონაცემთა ბაზა
    const presentations = {
        "კარფური": {
            "NEFIS COSMETICS": "https://docs.google.com/presentation/d/1xFMaItzI1AxviOoAHG37NUUfNnoO_rLF/edit?usp=drive_link&ouid=116577112344004965761&rtpof=true&sd=true",
            "SODAL": "https://docs.google.com/presentation/d/1Xx0v8JVZ4wkBEife2jOmCb1ZQiyzbrcA/edit?usp=drive_link&ouid=116577112344004965761&rtpof=true&sd=true",
            "EUREKA": "https://docs.google.com/presentation/d/1x4ziGx0dcKLJUStPKZKxjFOeE5juAkzv/edit?usp=drive_link&ouid=116577112344004965761&rtpof=true&sd=true"
        }
    };

    let currentNetwork = '';

    function nextStep(network) {
        currentNetwork = network;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('selectedNetwork').innerText = "🏢 " + network;
        
        const brandGrid = document.getElementById('brandGrid');
        brandGrid.innerHTML = '';

        let networkBrands = [];

        // ქსელების მიხედვით ბრენდების ფილტრაცია
        if (network === 'კარფური') {
            networkBrands = [...carrefourBrands];
        } else if (network === 'TT') {
            networkBrands = [...baseBrands, "სამოტივაციო ბრენდი", "ტიტიზი"];
        } else {
            networkBrands = [...baseBrands];
        }

        networkBrands.forEach(brand => {
            const div = document.createElement('div');
            div.className = 'card brand-card';
            if (brand === "სამოტივაციო ბრენდი" || brand === "ტიტიზი") {
                div.classList.add('tt-special');
            }
            div.innerText = brand;
            div.onclick = () => showLinks(brand);
            brandGrid.appendChild(div);
        });
    }

    function showLinks(brand) {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        document.getElementById('selectedBrand').innerText = "✨ " + brand;
        
        const presBtn = document.getElementById('presLink');

        // შემოწმება: არსებობს თუ არა პრეზენტაცია ამ ქსელისა და ბრენდისთვის
        if (presentations[currentNetwork] && presentations[currentNetwork][brand]) {
            presBtn.href = presentations[currentNetwork][brand];
            presBtn.onclick = null; // ჩვეულებრივი ლინკის გახსნა
            presBtn.style.opacity = "1";
        } else {
            presBtn.href = "javascript:void(0);";
            presBtn.onclick = () => alert("⚠️ ამ ბრენდის პრეზენტაცია ჯერ არ არის დამატებული.");
            presBtn.style.opacity = "0.7";
        }

        // დალაგების წილის ლინკი (მომავლისთვის)
        document.getElementById('shelfLink').href = "#";
    }

    function goBack() {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step1').style.display = 'block';
    }

    function goBackToBrands() {
        document.getElementById('step3').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }
</script>
</body>
</html>
