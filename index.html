<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .header { color: #0088cc; margin: 15px 0; font-size: 20px; font-weight: bold; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 500px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); 
                cursor: pointer; text-align: center; border: 1px solid #eee; font-weight: 500; font-size: 14px; transition: 0.2s; 
                display: flex; align-items: center; justify-content: center; min-height: 50px; }
        .card:active { background: #eef7ff; transform: scale(0.96); }
        .brand-card { font-size: 12px; text-transform: uppercase; padding: 10px 5px; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 20px; }
        .link-btn { background: #34a853; color: white; padding: 15px; border-radius: 10px; text-decoration: none; 
                    font-weight: bold; text-align: center; box-shadow: 0 4px 12px rgba(52,168,83,0.3); border: none; font-size: 16px; cursor: pointer; }
        .pres-btn { background: #ea4335; box-shadow: 0 4px 12px rgba(234,67,53,0.3); }
        .back-btn { margin-top: 20px; background: #6c757d; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        
        /* სურათის კონტეინერი */
        .img-container { width: 100%; overflow: auto; text-align: center; background: #fff; padding: 10px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .pres-img { width: 100%; height: auto; border-radius: 8px; display: block; }
    </style>
</head>
<body>

<!-- ნაბიჯი 1: ქსელის არჩევა -->
<div id="step1" style="width: 100%;">
    <div class="header">🏢 აირჩიე ქსელი</div>
    <div class="grid">
        <div class="card" onclick="nextStep('კარფური')">კარფური</div>
        <div class="card" onclick="nextStep('სუფთა სახლი')">სუფთა სახლი</div>
        <div class="card" onclick="nextStep('გუდვილი')">გუდვილი</div>
        <div class="card" onclick="nextStep('ფრესკო')">ფრესკო</div>
        <div class="card" onclick="nextStep('ნიკორა')">ნიკორა</div>
        <div class="card" onclick="nextStep('ლიბრე')">ლიბრე</div>
        <div class="card" onclick="nextStep('მაგნიტი')">მაგნიტი</div>
        <div class="card" onclick="nextStep('პსპ')">პსპ</div>
        <div class="card" onclick="nextStep('ავერსი')">ავერსი</div>
    </div>
</div>

<!-- ნაბიჯი 2: ბრენდის არჩევა -->
<div id="step2" style="display:none; width: 100%;">
    <div class="header" id="selectedNetwork"></div>
    <div class="grid" id="brandGrid"></div>
    <button class="back-btn" onclick="goBack()">🔙 უკან დაბრუნება</button>
</div>

<!-- ნაბიჯი 3: ღილაკები -->
<div id="step3" style="display:none; width: 100%;">
    <div class="header" id="selectedBrand"></div>
    <div class="btn-container">
        <button id="shelfLink" class="link-btn">📊 დალაგების წილი</button>
        <button id="presLink" class="link-btn pres-btn" onclick="openImagePresentation()">🖼️ პრეზენტაცია</button>
    </div>
    <button class="back-btn" onclick="goBackToBrands()">🔙 ბრენდებზე დაბრუნება</button>
</div>

<!-- ნაბიჯი 4: სურათის ჩვენება -->
<div id="step4" style="display:none; width: 100%;">
    <div class="header" id="presTitle">🖼️ პრეზენტაცია</div>
    <div class="img-container">
        <img id="presImg" class="pres-img" src="" alt="პრეზენტაცია">
    </div>
    <button class="back-btn" onclick="goBackToStep3()">🔙 უკან დაბრუნება</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    // განახლებული 5 ბრენდის სია ყველა ქსელისთვის
    const baseBrands = [
        "NEFIS COSMETICS", "ARIX", "PACLAN", "SODAL", "EUREKA"
    ];

    // GitHub-ში ატვირთული სურათების ფაილების სახელები
    const imagePresentations = {
        const imagePresentations = {
        "კარფური": {
            "NEFIS COSMETICS": "https://docs.google.com/presentation/d/1xFMaItzI1AxviOoAHG37NUUfNnoO_rLF/embed?start=false&loop=false&delayms=3000",
            "SODAL": "https://docs.google.com/presentation/d/1Xx0v8JVZ4wkBEife2jOmCb1ZQiyzbrcA/embed?start=false&loop=false&delayms=3000",
            "EUREKA": "https://docs.google.com/presentation/d/1x4ziGx0dcKLJUStPKZKxjFOeE5juAkzv/embed?start=false&loop=false&delayms=3000",
            "ARIX": "https://docs.google.com/presentation/d/1j4UFoRjps6RQ1nK9Xn_Di5117lOPy9q6/embed?start=false&loop=false&delayms=3000"
        }
    };

    let currentNetwork = '';
    let currentBrand = '';

    function nextStep(network) {
        currentNetwork = network;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('selectedNetwork').innerText = "🏢 " + network;
        
        const brandGrid = document.getElementById('brandGrid');
        brandGrid.innerHTML = '';

        baseBrands.forEach(brand => {
            const div = document.createElement('div');
            div.className = 'card brand-card';
            div.innerText = brand;
            div.onclick = () => showLinks(brand);
            brandGrid.appendChild(div);
        });
    }

    function showLinks(brand) {
        currentBrand = brand;
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        document.getElementById('selectedBrand').innerText = "✨ " + brand;
        
        const presBtn = document.getElementById('presLink');

        if (imagePresentations[currentNetwork] && imagePresentations[currentNetwork][brand]) {
            presBtn.style.opacity = "1";
        } else {
            presBtn.style.opacity = "0.7";
        }

        document.getElementById('shelfLink').onclick = function(e) {
            e.preventDefault();
            alert("⚠️ დალაგების წილი ჯერ არ არის დამატებული.");
        };
    }

    function openImagePresentation() {
        if (imagePresentations[currentNetwork] && imagePresentations[currentNetwork][currentBrand]) {
            const imgName = imagePresentations[currentNetwork][currentBrand];
            document.getElementById('presImg').src = imgName;
            document.getElementById('presTitle').innerText = "🖼️ " + currentBrand;
            
            document.getElementById('step3').style.display = 'none';
            document.getElementById('step4').style.display = 'block';
        } else {
            alert("⚠️ ამ ბრენდის პრეზენტაცია ჯერ არ არის დამატებული.");
        }
    }

    function goBack() {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step1').style.display = 'block';
    }

    function goBackToBrands() {
        document.getElementById('step3').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }

    function goBackToStep3() {
        document.getElementById('step4').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
    }
</script>
</body>
</html>
